# AADLC-TEMPLATE: replace every [bracket] for this agent, then delete this line
# Install once per machine: pip install pre-commit && pre-commit install && pre-commit autoupdate
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2   # `pre-commit autoupdate` moves this to the latest release
    hooks:
      - id: gitleaks
